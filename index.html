<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MovieMatch – user test</title>
<style>
  :root {
    color-scheme: light;
    --bg: #F7F6F3;
    --surface: #FFFFFF;
    --ink: #1F1D1A;
    --muted: #5C5850;
    --line: #C9C4B8;
    --line-soft: #E4E1DA;
    --accent: #2F4BC7;
    --accent-ink: #FFFFFF;
    --accent-soft: #E9EDFB;
    --accent-soft-ink: #1F2A5C;
    --dark: #1A1325;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px; line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 480px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 32px) 20px calc(env(safe-area-inset-bottom, 0px) + 32px);
    display: flex; flex-direction: column; gap: 24px;
  }
  h1 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 700; }
  p { margin: 0; }
  .part { font-size: 14px; font-weight: 600; color: var(--muted); }
  .lead { color: var(--muted); font-size: 16px; line-height: 1.5; }
  .small { font-size: 14px; line-height: 1.5; color: var(--muted); }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .stack-lg { display: flex; flex-direction: column; gap: 14px; }

  .tip { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); color: var(--accent-soft-ink); border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.45; }
  .tip svg { flex: 0 0 auto; margin-top: 1px; }
  .about { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 14px; padding: 16px; }

  label.q, legend.q { font-size: 18px; line-height: 1.35; font-weight: 600; padding: 0; }
  fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
  fieldset .stack { margin-top: 12px; }
  fieldset > .opts { margin-top: 12px; }
  textarea, input[type=text] {
    font: inherit; font-size: 16px; line-height: 1.5; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; width: 100%;
  }
  input[type=text] { min-height: 52px; }
  textarea { resize: vertical; min-height: 104px; }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  .btn { font: inherit; font-size: 17px; font-weight: 600; min-height: 52px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); width: 100%; cursor: pointer; }
  .btn:focus-visible, .opt:focus-visible, .shot:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn[data-go="ready"]:disabled { opacity: 1; font-size: 22px; }

  .scale { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .scale-ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .opts { display: grid; gap: 8px; }
  .opts-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .opts-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opt {
    font: inherit; font-size: 16px; min-height: 48px; border-radius: 12px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink); padding: 8px 10px;
  }
  .opt.list { text-align: left; padding: 12px 14px; min-height: 52px; }
  .opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .opt.list[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); border: 2px solid var(--accent); }

  .progress { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .progress span { height: 4px; border-radius: 2px; background: #DAD6CD; position: relative; }
  .progress span.past::after { content: ""; position: absolute; left: 0; right: 0; top: -14px; bottom: -14px; }
  .progress span.on { background: var(--accent); }
  .stephead { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: var(--muted); }

  .shotrow { display: flex; gap: 16px; align-items: flex-end; width: 100%; padding: 0; border: 0; background: none; text-align: left; font: inherit; color: inherit; cursor: zoom-in; }
  .shotrow > img, .shotrow > .mini { flex: 0 0 auto; width: 164px; height: auto; border-radius: 14px; border: 1px solid #DAD6CD; display: block; }
  .shotrow .side { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding-bottom: 2px; }
  .shotrow .side p { font-size: 13px; line-height: 1.45; color: var(--muted); }
  .shotrow .side b { font-size: 13px; color: var(--accent); }
  .shotrow:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; border-radius: 14px; }
  .films { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .film { display: flex; flex-direction: column; gap: 6px; }
  .poster { aspect-ratio: 2 / 3; width: 100%; border-radius: 10px; background: #2A1F3D; object-fit: cover; display: block; }
  .film-title { font-size: 13px; line-height: 1.3; font-weight: 600; }
  .vote { align-self: flex-start; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 9px; background: #EDEAE4; color: #4A463F; }
  .vote.yes { background: #DDF3E4; color: #135C2E; }
  .vote.seen { background: #FBE9D5; color: #7A3E0B; }
  .winner { display: flex; gap: 16px; align-items: flex-end; }
  .winner .poster { width: 130px; flex: 0 0 auto; border-radius: 12px; }

  /* First look: full screen for 5 seconds */
  .firstlook { position: fixed; inset: 0; background: var(--dark); display: flex; flex-direction: column; }
  .firstlook .bar, .protobar {
    background: var(--bg); border-bottom: 1px solid var(--line-soft);
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px;
  }
  .count { font-weight: 700; color: var(--accent-ink); background: var(--accent); border-radius: 999px; min-width: 32px; text-align: center; padding: 3px 10px; }
  .firstlook img { flex: 1 1 auto; min-height: 0; width: 100%; object-fit: contain; object-position: top; }

  /* Prototype inside the page */
  .proto { position: fixed; inset: 0; background: var(--dark); display: flex; flex-direction: column; }
  .protobar { padding-top: calc(env(safe-area-inset-top, 0px) + 6px); padding-bottom: 6px; min-height: 0; }
  .protobar .task { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stuck { font: inherit; font-size: 14px; font-weight: 600; color: var(--accent); background: none; border: 0; text-decoration: underline; padding: 2px 0; min-height: 28px; white-space: nowrap; cursor: pointer; }
  .proto .stage { flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; align-items: stretch; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .proto iframe { border: 0; width: 100%; height: 100%; background: var(--dark); }
  @media (min-width: 700px) {
    .proto .stage { align-items: center; padding: 24px; }
    .proto iframe { width: 390px; height: min(800px, 100%); border: 10px solid #222; border-radius: 40px; }
  }

  .lightbox { position: fixed; inset: 0; background: rgba(15, 12, 20, .92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); gap: 12px; z-index: 10; }
  .lightbox img { max-width: 100%; max-height: calc(100% - 64px); border-radius: 14px; }
  .lightbox button { font: inherit; font-size: 16px; font-weight: 600; color: #fff; background: rgba(255,255,255,.15); border: 0; border-radius: 999px; padding: 10px 22px; min-height: 44px; cursor: pointer; }

  .notice { background: #FBE9D5; color: #5C2E06; border-radius: 12px; padding: 12px 14px; font-size: 15px; }

  /* Recreations of the tester's own screens */
  .mini { width: 164px; height: 337px !important; overflow: hidden; position: relative; }
  .mini .mock { transform: scale(.42); transform-origin: top left; position: absolute; top: 0; left: 0; }
  .mock { width: 390px; height: 800px; background: #0C0A11; color: #F2EEF8; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 28px 22px; display: flex; flex-direction: column; gap: 14px; text-align: left; overflow: hidden; }
  .m-x { font-size: 26px; color: #CFC8DC; line-height: 1; }
  .m-counter { font-size: 13px; font-weight: 700; letter-spacing: .2em; color: #A49CB4; margin-top: 18px; }
  .m-card { position: relative; flex: 1 1 auto; border-radius: 30px; overflow: hidden; background: #241B33 center / cover no-repeat; border: 1px solid #2E2540; }
  .m-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,10,17,0) 25%, rgba(27,20,40,.92) 58%, #1B1428 100%); }
  .m-info { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 8px; }
  .m-title { font-size: 30px; font-weight: 700; line-height: 1.1; color: #FFFFFF; }
  .m-meta { font-size: 14px; color: #E3DDEC; }
  .m-syn { font-size: 14px; line-height: 1.4; color: #D7D0E2; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .m-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .m-btns span { border-radius: 999px; text-align: center; font-weight: 700; font-size: 18px; padding: 13px 0; color: #FFFFFF; }
  .m-nope { background: #BF4A43; } .m-yes { background: #3D875A; }
  .m-seen { text-align: center; font-size: 15px; color: #CFC8DC; margin-top: 6px; }
  .m-psst { text-align: center; font-size: 13px; color: #A49CB4; }
  .m-hab { text-align: center; font-size: 30px; font-weight: 700; color: #CFCBD4; margin: 26px 0 8px; }
  .m-ticket { border-radius: 30px; overflow: hidden; background: #1B1428; border: 1px solid #2E2540; display: flex; flex-direction: column; }
  .m-tposter { height: 280px; background: #241B33 center / cover no-repeat; }
  .m-pill { align-self: center; margin-top: -18px; background: #17111F; border: 1px solid #3A3048; border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 700; color: #F2EEF8; position: relative; }
  .m-pill-top { margin: -4px auto 4px; }
  .m-tbody { padding: 10px 18px 20px; display: flex; flex-direction: column; gap: 8px; }
  .m-wtw { font-size: 12px; font-weight: 700; letter-spacing: .16em; color: #A49CB4; margin-top: 8px; }
  .m-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .m-chips span { border: 1px solid #4A4058; border-radius: 999px; padding: 4px 12px; font-size: 13px; color: #D7D0E2; }
  .m-new { text-align: center; font-weight: 700; font-size: 17px; color: #E3DDEC; margin-top: 18px; }
  .lightbox .mock { flex: 0 0 auto; border-radius: 18px; transform-origin: center; }
  .recreated { font-size: 13px; line-height: 1.45; color: var(--muted); }

  .ready { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; padding: 24px; }
  .ready .num { font-size: 120px; font-weight: 800; line-height: 1; color: var(--accent); }
  @media (prefers-reduced-motion: no-preference) { .ready .num { animation: pop .9s ease-out; } @keyframes pop { from { transform: scale(1.6); opacity: 0; } 30% { opacity: 1; } to { transform: scale(1); opacity: 1; } } }

  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); max-width: 448px; margin: 0 auto; background: var(--ink); color: #FFFFFF; border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.45; z-index: 20; }

  .need { font-size: 14px; font-weight: 600; color: #A3261B; margin-top: 4px; }
  textarea.missing, input.missing { border-color: #A3261B; }
  .missing-group .opt { border-color: #A3261B; }

  .backbar { position: absolute; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); background: var(--bg); color: var(--ink); border-radius: 14px; padding: 14px 16px; font-size: 16px; font-weight: 600; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.35); z-index: 5; }
  @media (prefers-reduced-motion: no-preference) { .backbar { animation: up .3s ease-out; } @keyframes up { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } } }
  .proto { position: fixed; }
  .proto .stage { position: relative; }

  .backpill { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(247,246,243,.95); color: var(--ink); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.3); z-index: 5; }
  @media (prefers-reduced-motion: no-preference) { .backpill { animation: pillin .3s ease-out; } @keyframes pillin { from { opacity: 0; transform: translate(-50%, -6px); } to { opacity: 1; transform: translate(-50%, 0); } } }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) { main { animation: in .25s ease-out; } @keyframes in { from { opacity: 0; } to { opacity: 1; } } }
</style>

<body>
<div id="app"><main><h1>Loading the test…</h1><p class="lead">If this message doesn’t go away, open this page in Chrome or Safari. Previews and some in-app browsers don’t run the test.</p></main></div>

<script>
/* ============================================================
   SETTINGS: fill in the two Supabase values before uploading.
   They're the same two values you pasted into App.tsx.
   ============================================================ */
const CONFIG = {
  prototypeUrl: "https://maze-swab-65680810.figma.site/",
  supabaseProjectId: "mhxolypcoccahumanspw",
  supabaseAnonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1oeG9seXBjb2NjYWh1bWFuc3B3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NDA1MTcsImV4cCI6MjEwODAxNjUxN30.p8rcHPJUWKbRs_ceYMPI6u5MRFG1NYkTbYp8GQy6-Bk",
  stuckAfterSeconds: 40,
  winnerHoldSeconds: 8,
  firstLookSeconds: 5
};

const LOBBY_SHOTS = {
  "warm & fuzzy": "img/lobby-host-warm-fuzzy.jpg",
  "giggle time": "img/lobby-host-giggle-time.jpg",
  "buckle up": "img/lobby-host-buckle-up.jpg",
  "feeling spooky": "img/lobby-host-feeling-spooky.jpg",
  "hit us in the feels": "img/lobby-host-hit-us-in-the-feels.jpg",
  "butterflies, please": "img/lobby-host-butterflies-please.jpg",
  "surprise us": "img/lobby-host-surprise-us.jpg",
  "none": "img/lobby-host-no-mood.jpg"
};

/* ---------- mood names: the logger once sent extra text after the mood (TEST23), so match by how it starts ---------- */
const MOODS = ["Warm & fuzzy", "Giggle time", "Buckle up", "Feeling spooky", "Hit us in the feels", "Butterflies, please", "Surprise us"];
function cleanMood(raw) {
  if (raw == null) return raw;
  const low = String(raw).toLowerCase().trim();
  const hit = MOODS.find((m) => low.startsWith(m.toLowerCase()));
  return hit || raw;
}

/* ---------- small helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const params = new URLSearchParams(location.search);
const TESTER = (params.get("tester") || "").slice(0, 20);
const ROLE = params.get("role") === "joiner" ? "joiner" : "host";
const KEY = "mm_test_" + TESTER;

const MIC = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F4BC7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><line x1="12" y1="17" x2="12" y2="22"></line></svg>';
const micTip = '<div class="tip">' + MIC + '<p>Typing is tiring on a phone. Tap the microphone on your keyboard and just say your answer out loud.</p></div>';

/* ---------- state (kept in this tab, so a reload doesn't lose answers) ---------- */
let S = {
  screen: "start",
  reached: { setup: false, joining: false, lobby: false, voting: false, winner: false },
  mood: undefined,
  moodFallback: false,
  films: [],
  votes: {},
  winner: null,
  stuck: false,
  protoStartedAt: null,
  protoEndedAt: null,
  stepIndex: 0,
  protoRestarts: 0,
  answers: {},
  pending: []
};
try { const saved = sessionStorage.getItem(KEY); if (saved) S = Object.assign(S, JSON.parse(saved)); } catch (e) {}
const persist = () => { try { sessionStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* ---------- saving answers to Supabase ---------- */
function postRows(rows) {
  return fetch("https://" + CONFIG.supabaseProjectId + ".supabase.co/rest/v1/test_answers", {
    method: "POST",
    keepalive: true,
    headers: { apikey: CONFIG.supabaseAnonKey, "Content-Type": "application/json", Prefer: "return=minimal" },
    body: JSON.stringify(rows)
  }).then((r) => { if (!r.ok) throw new Error("save failed " + r.status); });
}
function save(screen, answers) {
  S.answers[screen] = answers;
  S.pending.push({ tester: TESTER, role: ROLE, screen: screen, answers: answers, client_ts: Date.now() });
  persist();
  const rows = S.pending.slice();
  postRows(rows).then(() => {
    S.pending = S.pending.filter((p) => !rows.some((r) => r.screen === p.screen && r.client_ts === p.client_ts));
    persist();
  }).catch(() => { /* stays in S.pending and is sent again with the next save */ });
}

/* ---------- reading the form on the current screen ---------- */
function collect() {
  const out = {};
  document.querySelectorAll("[data-q]").forEach((el) => {
    const k = el.getAttribute("data-q");
    if (el.matches("textarea, input")) out[k] = el.value.trim();
    else { const on = el.querySelector('[aria-pressed="true"]'); out[k] = on ? on.getAttribute("data-v") : null; }
  });
  return out;
}

/* ---------- building blocks ---------- */
// Every question is required unless it says "Optional". requiredIf: only required when another answer has a value.
const req = (opts) => opts && opts.optional ? '' : (opts && opts.requiredIf ? ' data-required-if="' + esc(opts.requiredIf) + '"' : ' data-required="1"');
const textQ = (key, label, placeholder, opts) => {
  opts = opts || {};
  return '<div class="stack"><label class="q" for="' + key + '">' + label + '</label>' +
    (opts.hint ? '<span class="small">' + opts.hint + '</span>' : '') +
    (opts.input
      ? '<input type="text" id="' + key + '" data-q="' + key + '"' + req(opts) + ' placeholder="' + esc(placeholder) + '" autocomplete="off">'
      : '<textarea id="' + key + '" data-q="' + key + '"' + req(opts) + ' rows="' + (opts.rows || 4) + '" placeholder="' + esc(placeholder) + '"></textarea>') +
    '</div>';
};
const choiceQ = (key, label, values, cls) =>
  '<fieldset><legend class="q">' + label + '</legend><div class="opts ' + (cls || "opts-3") + '" data-q="' + key + '" data-required="1" role="group">' +
  values.map((v) => '<button type="button" class="opt' + (cls === "list" ? " list" : "") + '" aria-pressed="false" data-v="' + esc(v) + '">' + esc(v) + '</button>').join("") +
  '</div></fieldset>';
const listQ = (key, label, values) =>
  '<fieldset><legend class="q">' + label + '</legend><div class="opts" data-q="' + key + '" data-required="1" role="group">' +
  values.map((v) => '<button type="button" class="opt list" aria-pressed="false" data-v="' + esc(v) + '">' + esc(v) + '</button>').join("") +
  '</div></fieldset>';
const easeQ = (key) =>
  '<fieldset><legend class="q">How easy or hard was this step?</legend><div class="stack"><div class="scale" data-q="' + key + '" data-required="1" role="group">' +
  [1, 2, 3, 4, 5, 6, 7].map((n) => '<button type="button" class="opt" aria-pressed="false" aria-label="' + n + ' of 7" data-v="' + n + '">' + n + '</button>').join("") +
  '</div><div class="scale-ends"><span>Very hard</span><span>Very easy</span></div></div></fieldset>';
const confusingQ = (key, placeholder, required) => required
  ? textQ(key, "What was confusing, or missing?", placeholder)
  : textQ(key, "Was anything here confusing, or missing?", placeholder, { hint: "Optional. Even small things help.", optional: true });
// For a stuck tester, the last step they reached is where they got stuck: there, "confusing or missing" is required.
const stuckHere = (step) => { const l = steps(); return !!S.stuck && l[l.length - 1] === step; };
// The mood question, by how far they got. Joiners who never saw the lobby get an optional guess (the code BOOS may hint at it). Hosts who never saw it skip it.
function moodQuestion() {
  if (S.reached.lobby) return textQ("q13_mood", "What was tonight’s mood? How could you tell?", "Write or say your answer…", { rows: 3 });
  if (ROLE === "joiner") return textQ("q13_mood_guess", "What kind of movie night do you think it was going to be? What gave you that idea?", "Write or say your guess…", { hint: "Optional.", rows: 3, optional: true });
  return "";
}
const side = (caption) => '<span class="side">' + (caption ? '<p>' + esc(caption) + '</p>' : '') + '<b>Tap to see it bigger</b></span>';
const shot = (src, alt, caption) => '<button type="button" class="shotrow" data-zoom="' + esc(src) + '"><img src="' + esc(src) + '" alt="' + esc(alt) + '">' + side(caption) + '</button>';


/* ---------- recreations of the tester's own screens ---------- */
const bg = (url) => url ? ' style="background-image:url(&quot;' + esc(url) + '&quot;)"' : '';
function votingMock(f) {
  return '<div class="mock"><div class="m-x">✕</div>' +
    '<div class="m-counter">' + esc((f.counter || "Movie 01 / 05").toUpperCase()) + '</div>' +

/* ---------- one run per tester ---------- */
const DONE_KEY = "mm_test_done_" + TESTER;
function markDone() { try { localStorage.setItem(DONE_KEY, "1"); } catch (e) {} }
function doneHere() { try { return localStorage.getItem(DONE_KEY) === "1"; } catch (e) { return false; } }
// Asks Supabase only "has this tester code finished?" (yes/no). If the check fails, the test simply starts.
function doneOnServer() {
  return fetch("https://" + CONFIG.supabaseProjectId + ".supabase.co/rest/v1/rpc/tester_finished", {
    method: "POST",
    headers: { apikey: CONFIG.supabaseAnonKey, "Content-Type": "application/json" },
    body: JSON.stringify({ t: TESTER })
  }).then((r) => r.ok ? r.json() : false).then((v) => v === true).catch(() => false);
}

/* ---------- navigation ---------- */
function go(name) {
  if (name === "step0") { S.stepIndex = 0; name = steps().length ? "step_" + steps()[0] : "overall"; }
  else if (name === "nextstep") {
    S.stepIndex += 1;
    const list = steps();
    name = S.stepIndex < list.length ? "step_" + list[S.stepIndex] : "overall";
  }
  S.screen = name;
  persist();
  try { history.pushState({ mmTest: true, screen: name }, ""); } catch (e) {}
  render();
}

function render() {
  const name = !TESTER ? "missing" : S.screen;
  const fn = SCREENS[name] || SCREENS.start;
  $("#app").innerHTML = fn();
  window.scrollTo(0, 0);
  if (name === "ready") startReady();
  if (name === "firstlook") startFirstLook();
  if (name === "proto") startProto();
  if (name === "thanks") { markDone(); watchSending(); }
}

/* ---------- thank-you screen: keep sending until everything has arrived ---------- */
function flushPending() {
  if (!S.pending.length) return Promise.resolve();
  const rows = S.pending.slice();
  return postRows(rows).then(() => {
    S.pending = S.pending.filter((p) => !rows.some((r) => r.screen === p.screen && r.client_ts === p.client_ts));
    persist();
  }).catch(() => {});
}
function watchSending() {
  const started = Date.now();
  const tick = () => {
    const sending = $("#sending"), sent = $("#sent");
    if (!sending || !sent) return;
    if (!S.pending.length) { sending.hidden = true; sent.hidden = false; return; }
    if (Date.now() - started > 2000) sending.hidden = false;
    flushPending().then(() => setTimeout(tick, S.pending.length ? 3000 : 0));
  };
  setTimeout(tick, 800);
}

document.addEventListener("click", (e) => {
  if (e.target.closest(".progress span.past")) {
    showToast("You can’t go back in this test. If you forgot something, add it at the end under ‘Anything else’.");
    return;
  }
  const opt = e.target.closest(".opt");
  if (opt) {
    opt.parentElement.querySelectorAll(".opt").forEach((b) => b.setAttribute("aria-pressed", "false"));
    opt.setAttribute("aria-pressed", "true");
    return;
  }
  const zoom = e.target.closest("[data-zoom]");
  if (zoom) {
    const box = document.createElement("div");
    box.className = "lightbox";
    box.innerHTML = '<img src="' + esc(zoom.getAttribute("data-zoom")) + '" alt="Screenshot, bigger"><button type="button">Close</button>';
    box.addEventListener("click", () => box.remove());
    document.body.appendChild(box);
    return;
  }
  const mz = e.target.closest("[data-mockzoom]");
  if (mz) {
    const box = document.createElement("div");
    box.className = "lightbox";
    const mock = mz.querySelector(".mock").cloneNode(true);
    const scale = Math.min((window.innerWidth - 32) / 390, (window.innerHeight - 110) / 800, 1);
    mock.style.transform = "scale(" + scale + ")";
    mock.style.margin = (-(800 * (1 - scale)) / 2) + "px " + (-(390 * (1 - scale)) / 2) + "px";
    box.appendChild(mock);
    const close = document.createElement("button"); close.type = "button"; close.textContent = "Close";
    box.appendChild(close);
    box.addEventListener("click", () => box.remove());
    document.body.appendChild(box);
    return;
  }
  const btn = e.target.closest("[data-go]");
  if (btn && btn.getAttribute("data-save") && !checkRequired()) return;
  if (btn && btn.getAttribute("data-go") === "ready") {
    if (btn.disabled) return;
    btn.disabled = true;
    let n = 3;
    btn.textContent = n + "…";
    const t = setInterval(() => {
      n -= 1;
      if (n <= 0) { clearInterval(t); go("firstlook"); return; }
      btn.textContent = n + "…";
    }, 1000);
    return;
  }
  if (btn) {
    const key = btn.getAttribute("data-save");
    if (key) save(key, collect());
    go(btn.getAttribute("data-go"));
  }
});



/* ---------- required answers ---------- */
function isAnswered(el) {
  if (el.matches("textarea, input")) return el.value.trim().length > 0;
  return !!el.querySelector('[aria-pressed="true"]');
}
function checkRequired() {
  document.querySelectorAll(".need").forEach((n) => n.remove());
  document.querySelectorAll(".missing, .missing-group").forEach((n) => n.classList.remove("missing", "missing-group"));
  const missing = [];
  document.querySelectorAll("[data-required], [data-required-if]").forEach((el) => {
    const cond = el.getAttribute("data-required-if");
    if (cond) {
      const [key, val] = cond.split(":");
      const other = document.querySelector('[data-q="' + key + '"]');
      const on = other && other.querySelector('[aria-pressed="true"]');
      if (!on || on.getAttribute("data-v") !== val) return;
    }
    if (isAnswered(el)) return;
    missing.push(el);
    el.classList.add(el.matches("textarea, input") ? "missing" : "missing-group");
    const msg = document.createElement("p");
    msg.className = "need"; msg.setAttribute("role", "alert");
    msg.textContent = "Please answer this one.";
    (el.matches("textarea, input") ? el : (el.closest("fieldset") || el)).insertAdjacentElement("afterend", msg);
  });
  if (missing.length) {
    const first = missing[0];
    first.scrollIntoView({ behavior: "smooth", block: "center" });
    if (first.matches("textarea, input")) first.focus({ preventScroll: true });
    return false;
  }
  return true;
}
// clear a message as soon as that question is answered
document.addEventListener("input", (e) => {
  const el = e.target.closest("[data-q]");
  if (el && el.value.trim()) { el.classList.remove("missing"); const n = el.nextElementSibling; if (n && n.classList.contains("need")) n.remove(); }
});
document.addEventListener("click", (e) => {
  const opt = e.target.closest(".opt");
  if (!opt) return;
  const group = opt.parentElement; group.classList.remove("missing-group");
  const fs = group.closest("fieldset") || group; const n = fs.nextElementSibling;
  if (n && n.classList.contains("need")) n.remove();
});

/* ---------- 3, 2, 1 before the first look ---------- */
function startReady() {
  let n = 3;
  const t = setInterval(() => {
    n -= 1;
    if (n <= 0) { clearInterval(t); go("firstlook"); return; }
    const old = $("#num"); if (!old) { clearInterval(t); return; }
    const fresh = old.cloneNode(false); fresh.textContent = String(n); old.replaceWith(fresh);
  }, 1000);
}

/* ---------- first look: 5 seconds, then gone ---------- */
function startFirstLook() {
  let left = CONFIG.firstLookSeconds;
  const t = setInterval(() => {
    left -= 1;
    const c = $("#count"); if (c) c.textContent = String(Math.max(left, 0));
    if (left <= 0) { clearInterval(t); go("firstlookQ"); }
  }, 1000);
}


/* ---------- countdown before the questions come back ---------- */
let backTimer = null;
function startBackCountdown() {
  const lead = 4;
  setTimeout(() => {
    if (S.screen !== "proto") return;
    const stage = document.querySelector(".proto .stage"); if (!stage) return;
    const bar = document.createElement("div"); bar.className = "backpill"; bar.setAttribute("role", "status");
    stage.appendChild(bar);
    let n = lead;
    const show = () => { bar.textContent = "Back to the questions in " + n + "…"; };
    show();
    clearInterval(backTimer);
    backTimer = setInterval(() => { n -= 1; if (n <= 0) { clearInterval(backTimer); return; } show(); }, 1000);
  }, Math.max(0, (CONFIG.winnerHoldSeconds - lead) * 1000));
}

  if (reloadNote) {
    reloadNote = false;
    const stage = document.querySelector(".proto .stage");
    if (stage) {
      const bar = document.createElement("div"); bar.className = "backbar"; bar.setAttribute("role", "status");
      bar.textContent = ROLE === "joiner" ? "The page was reloaded, so the app started over. Please join again with the code BOOS." : "The page was reloaded, so the app started over. Please set up movie night again.";
      stage.appendChild(bar);
      setTimeout(() => bar.remove(), 7000);
    }
  }
  if (!S.protoStartedAt) { S.protoStartedAt = Date.now(); persist(); }
  lastScreenAt = Date.now();
  clearInterval(stuckTimer);
  stuckTimer = setInterval(() => {
    const b = $("#stuck");
    if (b && Date.now() - lastScreenAt > CONFIG.stuckAfterSeconds * 1000) b.hidden = false;
  }, 1000);
  const b = $("#stuck");
  if (b) b.addEventListener("click", () => endProto(true));
}

function endProto(stuck) {
  if (finishing) return;
  finishing = true;
  clearInterval(stuckTimer);
  S.stuck = !!stuck;
  S.protoEndedAt = Date.now();
  if (S.reached.voting) S.reached.lobby = true;
  if (S.reached.lobby) { if (ROLE === "joiner") S.reached.joining = true; else S.reached.setup = true; }
  // Joiners always join with BOOS, which is always "Feeling spooky". Used only if the app sent no mood.
  if (ROLE === "joiner" && S.reached.lobby && (S.mood === undefined || S.mood === null)) { S.mood = "Feeling spooky"; S.moodFallback = true; }
  save("prototype", {
    completed: S.reached.winner && !stuck,
    stuck: S.stuck,
    mood: S.mood === undefined ? "unknown" : S.mood,
    mood_fallback: !!S.moodFallback,
    mood_raw: S.moodRaw === undefined ? null : S.moodRaw,
    films: S.films,
    votes: S.votes,
    winner: S.winner,
    reached: S.reached,
    duration_seconds: Math.round((S.protoEndedAt - S.protoStartedAt) / 1000),
    restarts_after_reload: S.protoRestarts || 0
  });
  go(stuck ? "stuckQ" : "quick");
}

window.addEventListener("message", (e) => {
  let host = "";
  try { host = new URL(e.origin).hostname; } catch (err) { return; }
  if (!host.endsWith(".figma.site")) return;
  const m = e.data;
  if (!m || m.source !== "moviematch" || S.screen !== "proto") return;
  const d = m.data || {};
  if (m.type === "screen") {
    lastScreenAt = Date.now();
    const b = $("#stuck"); if (b) b.hidden = true;
    if (/set up tonight/i.test(d.screen || "")) S.reached.setup = true;
    if (/enter your code/i.test(d.screen || "")) S.reached.joining = true;
    // Safety net: if the winner screen shows but no winner signal follows, move on anyway.
    if (/habemus|match!/i.test(d.screen || "") && !S.winner) {
      const hs = d.headings || [];
      setTimeout(() => {
        if (S.winner || S.screen !== "proto") return;
        const titles = S.films.map((f) => f.title);
        const title = hs.find((x) => titles.indexOf(x) !== -1) || hs.find((x) => !/habemus|match!|said yes/i.test(x)) || "";
        S.winner = { title: title, poster: null, result: null, headings: hs, fallback: true };
        S.reached.winner = true;
        persist();
        endProto(false);
      }, (CONFIG.winnerHoldSeconds + 3) * 1000);
    }
  }
  if (m.type === "mood") { S.moodRaw = d.mood; S.mood = cleanMood(d.mood); S.reached.lobby = true; if (ROLE === "joiner") S.reached.joining = true; else S.reached.setup = true; }
  if (m.type === "film" && d.title && !S.films.some((f) => f.title === d.title)) { S.films.push({ title: d.title, poster: d.poster || null, meta: d.meta || null, synopsis: d.synopsis || null, counter: d.counter || null }); S.reached.voting = true; }
  if (m.type === "vote" && d.title) S.votes[d.title] = d.vote;
  if (m.type === "winner" && !S.winner) {
    const hs = d.headings || [];
    const titles = S.films.map((f) => f.title);
    const title = hs.find((h) => titles.indexOf(h) !== -1) || hs.find((h) => !/habemus|match!|said yes/i.test(h)) || hs[0] || "";
    S.winner = { title: title, poster: d.poster || null, result: d.result || null, headings: hs, meta: d.meta || null, synopsis: d.synopsis || null, services: d.services || [] };
    S.reached.winner = true;
    persist();
    startBackCountdown();
    setTimeout(() => endProto(false), CONFIG.winnerHoldSeconds * 1000);
  }
  persist();
});

/* ---------- the browser back button: stay on the test, explain why ---------- */
let toastTimer = null;
function showToast(text) {
  let t = $("#toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = text; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 6000);
}
try { history.pushState({ mmTest: true }, ""); } catch (e) {}
window.addEventListener("popstate", () => {
  try { history.pushState({ mmTest: true }, ""); } catch (e) {}
  showToast("You can’t go back in this test. If you forgot something, add it at the end under ‘Anything else’.");
});

/* ---------- the page was reloaded while the prototype was open ---------- */
let reloadNote = false;
if (TESTER && S.screen === "proto") {
  if (S.winner) {
    S.reached.winner = true;
    setTimeout(() => endProto(false), 0);
  } else {
    S.films = []; S.votes = {}; S.mood = undefined; S.moodRaw = undefined; S.moodFallback = false; S.winner = null;
    S.reached = { setup: false, joining: false, lobby: false, voting: false, winner: false };
    S.protoRestarts = (S.protoRestarts || 0) + 1;
    reloadNote = true;
    persist();
  }
}

if (TESTER && S.screen === "start") {
  if (doneHere()) { S.screen = "done"; }
  else {
    render();
    doneOnServer().then((finished) => { if (finished && S.screen === "start") { markDone(); S.screen = "done"; persist(); render(); } });
  }
}
if (S.screen !== "start" || !TESTER) render();
</script>
